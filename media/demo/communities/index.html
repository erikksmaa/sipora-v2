<style>body{margin:0;background:#f7f4ed;color:#29343c;font:15px system-ui,sans-serif}main{max-width:1280px;padding:32px 24px;margin:auto}h1{font-size:30px;margin:0 0 10px}p{line-height:1.6}a{color:#a34327}nav,.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0}button,select{font:inherit;border:1px solid #ccc;border-radius:8px;background:white;padding:8px 12px;cursor:pointer}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:20px}figure{margin:0;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #00000009}.stage{min-height:190px;background:#fff;display:flex;justify-content:center;align-items:center;padding:18px;overflow:auto}.stage img{display:block;flex-shrink:0;width:128px;height:128px;object-fit:contain}.dark .stage{background:#202936}.checkered .stage{background-color:white;background-image:conic-gradient(#e3e6e9 25%,transparent 0 50%,#e3e6e9 0 75%,transparent 0);background-size:20px 20px}figcaption{padding:16px;border-top:1px solid #eee}strong{display:block;font-size:14px;margin:6px 0}small{color:#69757b}body.large section{grid-template-columns:1fr}body.large .stage{min-height:540px}@media(max-width:550px){main{padding:24px 12px}h1{font-size:24px}}</style>

</main><script>document.querySelector('#size').addEventListener('change',e=>{let size=Number(e.target.value);document.querySelectorAll('.stage img').forEach(img=>{img.style.width=size+'px';img.style.height=size+'px'});document.body.classList.toggle('large',size===512)});document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.remove('dark','checkered');if(button.dataset.bg!=='light')document.body.classList.add(button.dataset.bg)}));</script></html>
